name: Steam Workshop

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Install the build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gimp imagemagick librsvg2-bin potrace

    - name: Build the mod
      run: |
        ./build.sh "${VERSION#v}"

    - name: Build the release archive
      run: |
        cd out
        zip -r "${GITHUB_WORKSPACE}/release.zip" "ui-flags/" "ui-flags.mod"

    - name: Extract the release archive
      run: |
        unzip "release.zip" -d "release/"

    - name: Upload
      uses: hmlendea/steam-workshop-update@latest
      with:
        appid: 281990
        itemid: 1914541325
        path: "release/ui-flags/"
        changenote: "[url=https://github.com/hmlendea/stellaris-ui-flags/releases/tag/${{env.VERSION}}]Version ${{env.VERSION}}[/url]"
      env:
        STEAM_USERNAME: ${{secrets.STEAM_USERNAME}}
        STEAM_PASSWORD: ${{secrets.STEAM_PASSWORD}}
        STEAM_2FASEED: ${{secrets.STEAM_2FA_SEED}}