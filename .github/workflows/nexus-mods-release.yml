name: Nexus Mods

on:
  push:
    tags:
    - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.tag || github.ref_name }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ env.VERSION }}

    - name: Install the build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gimp imagemagick librsvg2-bin potrace

    - name: Build the mod
      run: |
        ./build.sh "${VERSION#v}"

    - name: Build the release archive
      run: |
        cd out
        zip -r "${GITHUB_WORKSPACE}/release.zip" "ui-flags/" "ui-flags.mod"

    - name: Upload
      uses: Nexus-Mods/upload-action@v1.0.0-beta.11
      with:
        api_key: ${{ secrets.NEXUSMODS_API_KEY }}
        file_id: 921613
        filename: release.zip
        display_name: ui-flags.zip
        version: ${{env.VERSION}}
        description: "Changelog: https://github.com/hmlendea/stellaris-ui-flags/releases/${{env.VERSION}}"
        category: main
        archive_existing_version: true
        update_mod_version: true